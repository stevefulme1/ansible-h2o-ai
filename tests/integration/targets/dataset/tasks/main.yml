---
- name: Create dataset (check mode)
  stevefulme1.h2o_ai.dataset:
    api_url: "{{ oci_h2o_api_url }}"
    api_key: "{{ oci_h2o_api_key }}"
    validate_certs: false
    name: "{{ oci_h2o_dataset_name }}"
    source: "{{ oci_h2o_dataset_source }}"
    description: Integration test dataset
    data_type: "{{ oci_h2o_dataset_data_type }}"
  check_mode: true
  register: _check
- name: Verify check mode reports changed
  ansible.builtin.assert:
    that:
      - _check is changed
- name: Create dataset
  stevefulme1.h2o_ai.dataset:
    api_url: "{{ oci_h2o_api_url }}"
    api_key: "{{ oci_h2o_api_key }}"
    validate_certs: false
    name: "{{ oci_h2o_dataset_name }}"
    source: "{{ oci_h2o_dataset_source }}"
    description: Integration test dataset
    data_type: "{{ oci_h2o_dataset_data_type }}"
  register: _create
- name: Verify dataset was created
  ansible.builtin.assert:
    that:
      - _create is changed
      - _create.dataset is defined
- name: Create dataset again (idempotent)
  stevefulme1.h2o_ai.dataset:
    api_url: "{{ oci_h2o_api_url }}"
    api_key: "{{ oci_h2o_api_key }}"
    validate_certs: false
    name: "{{ oci_h2o_dataset_name }}"
    source: "{{ oci_h2o_dataset_source }}"
    description: Integration test dataset
    data_type: "{{ oci_h2o_dataset_data_type }}"
  register: _idem
- name: Verify create idempotency
  ansible.builtin.assert:
    that:
      - _idem is not changed
- name: Update dataset
  stevefulme1.h2o_ai.dataset:
    api_url: "{{ oci_h2o_api_url }}"
    api_key: "{{ oci_h2o_api_key }}"
    validate_certs: false
    name: "{{ oci_h2o_dataset_name }}"
    source: "{{ oci_h2o_dataset_source }}"
    description: Updated integration test dataset
    data_type: "{{ oci_h2o_dataset_data_type }}"
  register: _update
- name: Verify dataset was updated
  ansible.builtin.assert:
    that:
      - _update is changed
- name: Delete dataset
  stevefulme1.h2o_ai.dataset:
    api_url: "{{ oci_h2o_api_url }}"
    api_key: "{{ oci_h2o_api_key }}"
    validate_certs: false
    name: "{{ oci_h2o_dataset_name }}"
    source: "{{ oci_h2o_dataset_source }}"
    state: absent
  register: _delete
- name: Verify dataset was deleted
  ansible.builtin.assert:
    that:
      - _delete is changed
- name: Delete dataset again (idempotent)
  stevefulme1.h2o_ai.dataset:
    api_url: "{{ oci_h2o_api_url }}"
    api_key: "{{ oci_h2o_api_key }}"
    validate_certs: false
    name: "{{ oci_h2o_dataset_name }}"
    source: "{{ oci_h2o_dataset_source }}"
    state: absent
  register: _delete_idem
- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - _delete_idem is not changed
